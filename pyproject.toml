[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiqa-metrics"
version = "0.1.0"
description = "QA service metrics CLI for test and issue evidence."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
docs = ["mkdocs>=1.6"]

[project.scripts]
wikiqa-metrics = "wikiqa_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["metrics"]

[tool.pytest.ini_options]
testpaths = ["metrics/tests"]

[tool.ruff]
line-length = 100
src = ["metrics", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
